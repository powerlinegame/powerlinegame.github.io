<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powerline.io</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050b14;
            color: #fff;
        }

        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #060d1a;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 11, 20, 0.75);
            backdrop-filter: blur(8px);
            z-index: 10;
            pointer-events: auto;
        }

        .menu-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 450px;
            width: 90%;
            text-align: center;
        }

        #game-logo {
            max-width: 380px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(255, 0, 128, 0.6));
        }

        .logo-fallback {
            font-size: 3rem;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, #ff007f, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: none;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #00f0ff;
            text-transform: uppercase;
            font-weight: 700;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 2px solid #00f0ff;
            background: rgba(6, 20, 40, 0.8);
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            border-color: #39ff14;
        }

        .btn-play {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #39ff14, #00b300);
            color: #050b14;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .btn-play:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.8);
        }

        .btn-play:active {
            transform: scale(0.98);
        }

        .status-text {
            font-size: 0.9rem;
            color: #a0aec0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ffaa00;
            box-shadow: 0 0 8px #ffaa00;
        }

        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(5, 11, 20, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            min-width: 200px;
            backdrop-filter: blur(4px);
            pointer-events: auto;
        }

        #leaderboard h3 {
            font-size: 0.85rem;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 4px;
        }

        .lb-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .lb-entry.me {
            color: #39ff14;
        }

        #killfeed {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column-reverse;
            gap: 6px;
            max-height: 200px;
            overflow: hidden;
            pointer-events: none;
        }

        .kf-item {
            background: rgba(5, 11, 20, 0.8);
            border-left: 3px solid #ff0055;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        #death-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 11, 20, 0.85);
            backdrop-filter: blur(6px);
            z-index: 9;
            pointer-events: auto;
        }

        .death-card {
            background: rgba(10, 20, 35, 0.9);
            border: 2px solid #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.3);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .death-title {
            color: #ff0055;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 10px 0;
        }

        .stat-box {
            background: rgba(5, 11, 20, 0.6);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: #00f0ff;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #a0aec0;
            text-transform: uppercase;
        }

        #minimap-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 140px;
            background: rgba(5, 11, 20, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
            pointer-events: none;
        }

        #minimap {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="menu-screen">
        <div class="menu-content">
            <img src="logo.png" alt="Powerline.io" id="game-logo" onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='block';">
            <div class="logo-fallback">POWERLINE.IO</div>

            <div class="input-group">
                <label for="nickname">Enter Nickname</label>
                <input type="text" id="nickname" maxlength="15" value="PowerRider" placeholder="Player Name" />
            </div>

            <button class="btn-play" id="play-btn">PLAY NOW</button>

            <div class="status-text">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-msg">Traversing STUN / Connecting...</span>
            </div>
        </div>
    </div>

    <div id="death-screen">
        <div class="death-card">
            <div class="death-title">CIRCUIT SHORTED</div>
            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-value" id="final-score">0</div>
                    <div class="stat-label">Final Score</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="final-length">0</div>
                    <div class="stat-label">Peak Length</div>
                </div>
            </div>
            <button class="btn-play" id="respawn-btn">PLAY AGAIN</button>
        </div>
    </div>

    <div class="overlay">
        <div id="minimap-container">
            <canvas id="minimap" width="140" height="140"></canvas>
        </div>

        <div id="leaderboard">
            <h3>Leaderboard</h3>
            <div id="lb-list"></div>
        </div>

        <div id="killfeed"></div>
    </div>

    <script>
        const WORLD_SIZE = 4000;
        const BASE_SPEED = 3.8;
        const BOOST_SPEED = 7.5;
        const LINE_WIDTH = 10;
        const GRID_SPACING = 40;
        const MIN_SAFE_DIST = 300;
        const BOT_TARGET_COUNT = 8;
        const HOST_ROOM_ID = 'powerline-global-v2-room';

        // STUN / ICE Configuration for NAT & VPN Traversal
        const PEER_CONFIG = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun4.l.google.com:19302' }
                ]
            }
        };

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap');
        const mctx = minimapCanvas.getContext('2d');

        let camera = { x: WORLD_SIZE / 2, y: WORLD_SIZE / 2 };
        let myId = null;
        let isPlaying = false;
        let myPlayer = null;

        let players = {};
        let foodPellets = [];
        let sparkParticles = [];

        let peer = null;
        let hostConnection = null;
        let connections = {};
        let isHost = false;

        const keys = {};

        class Player {
            constructor(id, name, x, y, isBot = false) {
                this.id = id;
                this.name = name || 'Rider';
                this.isBot = isBot;
                this.dir = { x: 1, y: 0 };
                this.nextDir = { x: 1, y: 0 };
                this.speed = BASE_SPEED;
                this.isBoosting = false;
                this.score = 0;
                this.alive = true;
                this.color = isBot ? '#ff0055' : '#39ff14';

                this.path = [];
                const initialLength = 40;
                for (let i = 0; i < initialLength; i++) {
                    this.path.push({ x: x - i * 2, y: y });
                }

                this.botTimer = 0;
            }

            get head() {
                return this.path[0];
            }

            update() {
                if (!this.alive) return;

                if ((this.nextDir.x !== 0 && this.nextDir.x !== -this.dir.x) ||
                    (this.nextDir.y !== 0 && this.nextDir.y !== -this.dir.y)) {
                    this.dir = { ...this.nextDir };
                }

                if (this.isBot) {
                    this.updateBot();
                }

                this.checkBoosting();

                const newHead = {
                    x: this.head.x + this.dir.x * this.speed,
                    y: this.head.y + this.dir.y * this.speed
                };

                this.path.unshift(newHead);

                const targetPathLength = Math.floor(40 + (this.score / 2));
                while (this.path.length > targetPathLength) {
                    this.path.pop();
                }

                if (newHead.x < 0 || newHead.x > WORLD_SIZE || newHead.y < 0 || newHead.y > WORLD_SIZE) {
                    killPlayer(this, null, 'wall');
                    return;
                }

                for (let i = foodPellets.length - 1; i >= 0; i--) {
                    const p = foodPellets[i];
                    if (Math.hypot(newHead.x - p.x, newHead.y - p.y) < LINE_WIDTH + p.size) {
                        this.score += p.val;
                        foodPellets.splice(i, 1);
                        if (isHost && foodPellets.length < 200) {
                            spawnPellet();
                        }
                    }
                }

                this.checkCollisions();
            }

            checkBoosting() {
                let boosting = false;
                const boostDistThreshold = 35;

                for (let pid in players) {
                    const other = players[pid];
                    if (!other.alive || other.id === this.id) continue;

                    for (let i = 0; i < other.path.length - 5; i += 4) {
                        const pt = other.path[i];
                        if (Math.hypot(this.head.x - pt.x, this.head.y - pt.y) < boostDistThreshold) {
                            boosting = true;
                            if (Math.random() < 0.4) {
                                sparkParticles.push({
                                    x: this.head.x + (Math.random() - 0.5) * 10,
                                    y: this.head.y + (Math.random() - 0.5) * 10,
                                    vx: (Math.random() - 0.5) * 4,
                                    vy: (Math.random() - 0.5) * 4,
                                    life: 1.0,
                                    color: '#00f0ff'
                                });
                            }
                            break;
                        }
                    }
                    if (boosting) break;
                }

                this.isBoosting = boosting;
                this.speed = boosting ? BOOST_SPEED : BASE_SPEED;
                if (boosting) this.score += 0.1;
            }

            checkCollisions() {
                const head = this.head;

                for (let pid in players) {
                    const other = players[pid];
                    if (!other.alive) continue;

                    const startIndex = (other.id === this.id) ? 25 : 0;

                    for (let i = startIndex; i < other.path.length - 1; i += 2) {
                        const p1 = other.path[i];
                        if (Math.hypot(head.x - p1.x, head.y - p1.y) < LINE_WIDTH * 0.85) {
                            killPlayer(this, other, other.id === this.id ? 'self' : 'player');
                            return;
                        }
                    }
                }
            }

            updateBot() {
                this.botTimer++;

                let leader = null;
                let topScore = -1;
                for (let pid in players) {
                    if (players[pid].alive && players[pid].score > topScore) {
                        topScore = players[pid].score;
                        leader = players[pid];
                    }
                }

                const possibleDirs = this.dir.x !== 0 ? 
                    [{ x: 0, y: 1 }, { x: 0, y: -1 }] : 
                    [{ x: 1, y: 0 }, { x: -1, y: 0 }];

                let wantedDir = this.dir;

                if (leader && leader.id !== this.id && Math.random() < 0.3) {
                    const dx = leader.head.x - this.head.x;
                    const dy = leader.head.y - this.head.y;
                    wantedDir = Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) };
                }

                let safeDir = null;
                for (let candidate of [wantedDir, ...possibleDirs]) {
                    if ((candidate.x !== 0 && candidate.x === -this.dir.x) || 
                        (candidate.y !== 0 && candidate.y === -this.dir.y)) continue;

                    const testX = this.head.x + candidate.x * 60;
                    const testY = this.head.y + candidate.y * 60;

                    let unsafe = testX < 60 || testX > WORLD_SIZE - 60 || testY < 60 || testY > WORLD_SIZE - 60;

                    if (!unsafe) {
                        for (let pid in players) {
                            const other = players[pid];
                            if (!other.alive) continue;
                            const start = (other.id === this.id) ? 20 : 0;
                            for (let i = start; i < other.path.length; i += 6) {
                                if (Math.hypot(testX - other.path[i].x, testY - other.path[i].y) < 45) {
                                    unsafe = true;
                                    break;
                                }
                            }
                            if (unsafe) break;
                        }
                    }

                    if (!unsafe) {
                        safeDir = candidate;
                        break;
                    }
                }

                if (safeDir) {
                    this.nextDir = safeDir;
                }
            }
        }

        function findSafeSpawn() {
            let attempt = 0;
            while (attempt < 100) {
                const x = 300 + Math.random() * (WORLD_SIZE - 600);
                const y = 300 + Math.random() * (WORLD_SIZE - 600);

                let safe = true;
                for (let pid in players) {
                    const p = players[pid];
                    if (p.alive && Math.hypot(p.head.x - x, p.head.y - y) < MIN_SAFE_DIST) {
                        safe = false;
                        break;
                    }
                }
                if (safe) return { x, y };
                attempt++;
            }
            return { x: WORLD_SIZE / 2, y: WORLD_SIZE / 2 };
        }

        function killPlayer(victim, killer, cause) {
            if (!victim.alive) return;
            victim.alive = false;

            for (let i = 0; i < victim.path.length; i += 3) {
                const pt = victim.path[i];
                foodPellets.push({
                    x: pt.x + (Math.random() - 0.5) * 20,
                    y: pt.y + (Math.random() - 0.5) * 20,
                    color: i % 2 === 0 ? '#ff3300' : '#ff9900',
                    size: 4 + Math.random() * 4,
                    val: 3
                });
            }

            let msg = '';
            if (cause === 'wall') {
                msg = `<b>${victim.name}</b> 🧱 Wall`;
            } else if (cause === 'self') {
                msg = `<b>${victim.name}</b> ⚡ <b>${victim.name}</b>`;
            } else if (killer) {
                msg = `<b>${killer.name}</b> ⚡ <b>${victim.name}</b>`;
                killer.score += 50;
            }
            addKillfeed(msg);

            if (victim.id === myId) {
                document.getElementById('final-score').innerText = Math.floor(victim.score);
                document.getElementById('final-length').innerText = victim.path.length;
                document.getElementById('death-screen').style.display = 'flex';
            }

            if (isHost && victim.isBot) {
                delete players[victim.id];
                setTimeout(() => {
                    if (Object.keys(players).length < BOT_TARGET_COUNT) {
                        spawnBot();
                    }
                }, 3000);
            }
        }

        function addKillfeed(htmlContent) {
            const kf = document.getElementById('killfeed');
            const item = document.createElement('div');
            item.className = 'kf-item';
            item.innerHTML = htmlContent;
            kf.appendChild(item);
            setTimeout(() => item.remove(), 5000);
        }

        function spawnBot() {
            const botId = 'bot_' + Math.random().toString(36).substr(2, 6);
            const botNames = ['CyberNeon', 'GridGhost', 'NullPointer', 'ByteSlayer', 'LaserTail', 'VoltRunner', 'GridOverlord'];
            const name = botNames[Math.floor(Math.random() * botNames.length)];
            const pos = findSafeSpawn();
            players[botId] = new Player(botId, name, pos.x, pos.y, true);
        }

        function spawnPellet() {
            foodPellets.push({
                x: Math.random() * WORLD_SIZE,
                y: Math.random() * WORLD_SIZE,
                color: Math.random() < 0.5 ? '#ff9900' : '#ffff00',
                size: 3 + Math.random() * 3,
                val: 1
            });
        }

        function initNetwork() {
            peer = new Peer(PEER_CONFIG);

            peer.on('open', (id) => {
                myId = id;
                document.getElementById('status-msg').innerText = 'Searching for active global host...';
                attemptToJoinHost();
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    attemptToJoinHost();
                } else {
                    becomeHost();
                }
            });
        }

        function attemptToJoinHost() {
            const conn = peer.connect(HOST_ROOM_ID, { relaxed: true });
            let connected = false;

            conn.on('open', () => {
                connected = true;
                isHost = false;
                hostConnection = conn;
                document.getElementById('status-msg').innerText = 'Connected to Host (Multiplayer Active)!';
                document.getElementById('status-dot').style.backgroundColor = '#39ff14';
                document.getElementById('status-dot').style.boxShadow = '0 0 8px #39ff14';
            });

            conn.on('data', (data) => {
                if (data.type === 'sync') {
                    foodPellets = data.pellets;
                    for (let pid in data.players) {
                        if (pid !== myId) {
                            players[pid] = Object.assign(new Player(), data.players[pid]);
                        }
                    }
                }
            });

            setTimeout(() => {
                if (!connected) {
                    conn.close();
                    becomeHost();
                }
            }, 2500);
        }

        function becomeHost() {
            peer.destroy();
            peer = new Peer(HOST_ROOM_ID, PEER_CONFIG);

            peer.on('open', (id) => {
                myId = id;
                isHost = true;
                document.getElementById('status-msg').innerText = 'Hosting Global Room (VPN Relays Active)';
                document.getElementById('status-dot').style.backgroundColor = '#39ff14';
                document.getElementById('status-dot').style.boxShadow = '0 0 8px #39ff14';

                for (let i = 0; i < 200; i++) spawnPellet();
                for (let i = 0; i < BOT_TARGET_COUNT; i++) spawnBot();

                peer.on('connection', (conn) => {
                    connections[conn.peer] = conn;
                    conn.on('data', (data) => {
                        if (data.type === 'input' && players[conn.peer]) {
                            players[conn.peer].nextDir = data.dir;
                        }
                    });
                });
            });

            peer.on('error', () => {
                setTimeout(initNetwork, 1000);
            });
        }

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (!myPlayer || !myPlayer.alive) return;

            let newDir = null;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') newDir = { x: 0, y: -1 };
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') newDir = { x: 0, y: 1 };
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') newDir = { x: -1, y: 0 };
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') newDir = { x: 1, y: 0 };

            if (newDir) {
                myPlayer.nextDir = newDir;
                if (!isHost && hostConnection && hostConnection.open) {
                    hostConnection.send({ type: 'input', dir: newDir });
                }
            }
        });

        function gameLoop() {
            for (let pid in players) {
                players[pid].update();
            }

            if (isHost) {
                const serializedPlayers = {};
                for (let pid in players) {
                    const p = players[pid];
                    serializedPlayers[pid] = {
                        id: p.id, name: p.name, isBot: p.isBot,
                        dir: p.dir, speed: p.speed, score: p.score,
                        alive: p.alive, path: p.path, color: p.color
                    };
                }
                for (let connId in connections) {
                    if (connections[connId].open) {
                        connections[connId].send({ type: 'sync', players: serializedPlayers, pellets: foodPellets });
                    }
                }
            }

            if (myPlayer && myPlayer.alive) {
                camera.x += (myPlayer.head.x - camera.x) * 0.1;
                camera.y += (myPlayer.head.y - camera.y) * 0.1;
            }

            render();
            requestAnimationFrame(gameLoop);
        }

        function render() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            ctx.fillStyle = '#060d1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2 - camera.x, canvas.height / 2 - camera.y);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            const startX = Math.floor((camera.x - canvas.width / 2) / GRID_SPACING) * GRID_SPACING;
            const endX = camera.x + canvas.width / 2;
            const startY = Math.floor((camera.y - canvas.height / 2) / GRID_SPACING) * GRID_SPACING;
            const endY = camera.y + canvas.height / 2;

            for (let x = startX; x < endX; x += GRID_SPACING) {
                for (let y = startY; y < endY; y += GRID_SPACING) {
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

            foodPellets.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            let topPlayer = null;
            let maxScore = -1;
            for (let pid in players) {
                if (players[pid].alive && players[pid].score > maxScore) {
                    maxScore = players[pid].score;
                    topPlayer = players[pid];
                }
            }

            for (let pid in players) {
                const p = players[pid];
                if (!p.alive || p.path.length < 2) continue;

                ctx.strokeStyle = p.color;
                ctx.lineWidth = LINE_WIDTH;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 12;

                ctx.beginPath();
                ctx.moveTo(p.path[0].x, p.path[0].y);
                for (let i = 1; i < p.path.length; i++) {
                    ctx.lineTo(p.path[i].x, p.path[i].y);
                }
                ctx.stroke();

                const head = p.head;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(head.x, head.y, LINE_WIDTH * 0.7, 0, Math.PI * 2);
                ctx.fill();

                if (topPlayer && topPlayer.id === p.id) {
                    ctx.font = '16px sans-serif';
                    ctx.fillText('👑', head.x - 8, head.y - 20);
                }

                ctx.shadowBlur = 0;
                ctx.font = 'bold 12px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, head.x, head.y + 25);
            }

            for (let i = sparkParticles.length - 1; i >= 0; i--) {
                const sp = sparkParticles[i];
                ctx.fillStyle = sp.color;
                ctx.fillRect(sp.x, sp.y, 3, 3);
                sp.x += sp.vx;
                sp.y += sp.vy;
                sp.life -= 0.05;
                if (sp.life <= 0) sparkParticles.splice(i, 1);
            }

            ctx.restore();

            renderLeaderboard();
            renderMinimap();
        }

        function renderLeaderboard() {
            const listEl = document.getElementById('lb-list');
            const sorted = Object.values(players)
                .filter(p => p.alive)
                .sort((a, b) => b.score - a.score)
                .slice(0, 6);

            listEl.innerHTML = sorted.map((p, idx) => `
                <div class="lb-entry ${p.id === myId ? 'me' : ''}">
                    <span>${idx + 1}. ${p.isBot ? '🤖' : '👤'} ${p.name}</span>
                    <span>${Math.floor(p.score)}</span>
                </div>
            `).join('');
        }

        function renderMinimap() {
            mctx.fillStyle = '#050b14';
            mctx.fillRect(0, 0, 140, 140);

            const scale = 140 / WORLD_SIZE;
            for (let pid in players) {
                const p = players[pid];
                if (!p.alive) continue;
                mctx.fillStyle = p.id === myId ? '#39ff14' : '#ff0055';
                mctx.fillRect(p.head.x * scale, p.head.y * scale, 3, 3);
            }
        }

        document.getElementById('play-btn').addEventListener('click', startGame);
        document.getElementById('respawn-btn').addEventListener('click', respawnGame);

        function startGame() {
            const name = document.getElementById('nickname').value || 'PowerRider';
            const pos = findSafeSpawn();

            myPlayer = new Player(myId, name, pos.x, pos.y, false);
            players[myId] = myPlayer;

            camera.x = pos.x;
            camera.y = pos.y;

            document.getElementById('menu-screen').style.display = 'none';
            isPlaying = true;
        }

        function respawnGame() {
            document.getElementById('death-screen').style.display = 'none';
            startGame();
        }

        initNetwork();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
