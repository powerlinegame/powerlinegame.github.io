<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Powerline.io</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#02040a',
                            cyan: '#00f3ff',
                            pink: '#ff0055',
                            yellow: '#fcee0a',
                            green: '#00ff66',
                            dark: '#080d1a'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Orbitron', monospace;
            background-color: #02040a;
            color: #f3f4f6;
            overflow: hidden;
            touch-action: none;
        }

        .neon-glow-cyan {
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.8), 0 0 16px rgba(0, 243, 255, 0.4);
        }

        .neon-glow-pink {
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.8), 0 0 16px rgba(255, 0, 85, 0.4);
        }

        .neon-border-cyan {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.15);
        }

        .cyber-panel {
            background: rgba(8, 13, 26, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-cyber-bg">

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas" class="absolute inset-0 w-full h-full cursor-crosshair"></canvas>

    <!-- In-Game HUD -->
    <div id="hud" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 md:p-6 z-20">
        <!-- Top HUD Row -->
        <div class="flex justify-between items-start">
            <!-- Player Stats Box -->
            <div class="cyber-panel px-5 py-3 rounded-xl border border-cyber-cyan/40 neon-border-cyan">
                <div class="text-[10px] text-cyber-cyan font-bold tracking-widest uppercase flex items-center gap-2">
                    <span>SCORE</span>
                    <span id="roleBadge" class="text-[9px] px-1.5 py-0.5 rounded bg-cyber-cyan/20 border border-cyber-cyan/40 text-cyber-cyan">INIT...</span>
                </div>
                <div id="hudScore" class="text-2xl md:text-3xl font-black text-white neon-glow-cyan">0</div>
                <div class="mt-1 text-xs text-gray-400">Length: <span id="hudLength" class="text-cyber-yellow font-bold">50</span></div>
            </div>

            <!-- Minimap -->
            <div class="cyber-panel p-1.5 rounded-xl border border-cyber-cyan/40 w-32 h-32 md:w-40 md:h-40 relative overflow-hidden hidden sm:block">
                <div class="absolute top-1 left-1.5 text-[9px] text-cyber-cyan tracking-wider z-10 font-bold">RADAR</div>
                <canvas id="minimapCanvas" class="w-full h-full rounded"></canvas>
            </div>

            <!-- Leaderboard -->
            <div class="cyber-panel px-4 py-3 rounded-xl border border-cyber-cyan/40 w-60 md:w-72">
                <div class="text-xs text-cyber-cyan font-bold tracking-widest uppercase mb-2 flex items-center justify-between">
                    <span>GRID RANKINGS</span>
                    <i class="fa-solid fa-trophy text-cyber-yellow text-xs"></i>
                </div>
                <div id="leaderboardList" class="space-y-1 text-xs">
                    <!-- Leaderboard entries injected dynamically -->
                </div>
            </div>
        </div>

        <!-- Center Notification Feed -->
        <div id="eventNotifications" class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center pointer-events-none space-y-1.5 z-30"></div>

        <!-- Bottom Left: Killfeed -->
        <div id="killfeedContainer" class="flex flex-col space-y-1.5 max-w-xs pointer-events-none">
            <!-- Killfeed items injected dynamically -->
        </div>

        <!-- Bottom Controls / Status Bar -->
        <div class="flex justify-between items-end">
            <div class="text-xs text-gray-500 font-mono hidden md:block">
                Grid System v4.0 | 90° Axis Lock Engine
            </div>
            <div class="cyber-panel px-3 py-1.5 rounded-lg text-[11px] text-gray-300 flex items-center space-x-2">
                <span class="text-cyber-cyan"><i class="fa-solid fa-keyboard mr-1"></i> WASD / Arrows</span>
                <span class="text-gray-500">|</span>
                <span class="text-cyber-yellow"><i class="fa-solid fa-bolt mr-1"></i> Ride Parallel to Boost</span>
            </div>
        </div>
    </div>

    <!-- Main Entry Modal -->
    <div id="menuModal" class="absolute inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="cyber-panel p-8 rounded-2xl border-2 border-cyber-cyan max-w-md w-full text-center neon-border-cyan shadow-2xl">
            <div class="mb-2 text-cyber-cyan font-bold tracking-widest text-xs uppercase">Unblocked Plus</div>
            <h1 class="text-3xl md:text-4xl font-black text-white mb-6 tracking-wider neon-glow-cyan">POWERLINE</h1>
            
            <div class="space-y-4 mb-6 text-left">
                <div>
                    <label class="block text-xs text-cyber-cyan font-bold mb-1 uppercase tracking-wider">Rider Call Sign</label>
                    <input type="text" id="playerNameInput" value="Rider_99" maxlength="12" class="w-full bg-cyber-dark border border-cyber-cyan/50 rounded-lg px-4 py-3 text-white font-bold focus:outline-none focus:border-cyber-cyan focus:ring-1 focus:ring-cyber-cyan">
                </div>

                <button id="playBtn" class="w-full bg-gradient-to-r from-cyan-500 via-blue-600 to-cyber-pink hover:from-cyan-400 hover:to-pink-500 text-white font-black py-4 px-6 rounded-xl shadow-lg transition transform hover:-translate-y-0.5 text-lg uppercase tracking-wider flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-play"></i>
                    <span id="playBtnText">PLAY</span>
                </button>
            </div>

            <div id="connectionStatus" class="text-xs text-gray-400 border-t border-gray-800/80 pt-4 flex items-center justify-center gap-2">
                <i class="fa-solid fa-wifi text-cyber-cyan animate-pulse"></i>
                <span id="statusText">Ready to enable p2p connection . . .</span>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="absolute inset-0 bg-black/90 backdrop-blur-lg hidden flex items-center justify-center z-50 p-4">
        <div class="cyber-panel p-8 rounded-2xl border-2 border-cyber-pink max-w-md w-full text-center shadow-2xl">
            <div class="text-cyber-pink font-black text-xs tracking-widest uppercase mb-1">SYSTEM DEREGISTERED</div>
            <h2 class="text-4xl font-black text-white mb-6 tracking-wider neon-glow-pink">REZED</h2>

            <div class="grid grid-cols-2 gap-4 mb-6 bg-cyber-dark p-4 rounded-xl border border-gray-800">
                <div>
                    <div class="text-xs text-gray-400 font-bold">FINAL SCORE</div>
                    <div id="finalScore" class="text-2xl font-black text-white">0</div>
                </div>
                <div>
                    <div class="text-xs text-gray-400 font-bold">PEAK LENGTH</div>
                    <div id="finalLength" class="text-2xl font-black text-cyber-cyan">0</div>
                </div>
            </div>

            <button id="restartBtn" class="w-full bg-gradient-to-r from-cyber-cyan to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-cyber-dark font-black py-4 px-6 rounded-xl shadow-lg transition transform hover:-translate-y-0.5 text-lg uppercase tracking-wider cursor-pointer">
                Re-Rez Grid
            </button>
        </div>
    </div>

    <script>
        // Game Constants
        const WORLD_SIZE = 3600;
        const CELL_SIZE = 20; // Crisp 20px Grid Snapping
        const BASE_SPEED = 200; // Grid units per second
        const BOOST_SPEED = 360; // Speed when boosted by riding adjacent
        const TARGET_ROOM_CAPACITY = 10;
        const LOBBY_ID_PREFIX = 'powerline-tron-classic-grid-v4-';

        // Direction Vectors (Strict 90-degree orthogonal movement)
        const DIR = {
            UP: { x: 0, y: -1 },
            DOWN: { x: 0, y: 1 },
            LEFT: { x: -1, y: 0 },
            RIGHT: { x: 1, y: 0 }
        };

        // Sound Synthesizer Engine
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTone(freq, type, duration, vol = 0.1) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            turn() { this.playTone(400, 'square', 0.05, 0.03); }
            boost() { this.playTone(600, 'sawtooth', 0.1, 0.04); }
            scoreEvent() { this.playTone(880, 'sine', 0.15, 0.08); }
            closeCall() { this.playTone(520, 'triangle', 0.1, 0.05); }
            crash() { this.playTone(100, 'sawtooth', 0.5, 0.2); }
            kill() { this.playTone(700, 'square', 0.25, 0.12); }
        }

        const sound = new SoundEngine();

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            minimapCanvas.width = 160;
            minimapCanvas.height = 160;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Camera Tracking
        const camera = {
            x: WORLD_SIZE / 2,
            y: WORLD_SIZE / 2,
            update(targetX, targetY) {
                this.x += (targetX - this.x) * 0.15;
                this.y += (targetY - this.y) * 0.15;
            }
        };

        class Rider {
            constructor(id, name, gridX, gridY, dir, color, isBot = false) {
                this.id = id;
                this.name = name;
                this.gridX = gridX;
                this.gridY = gridY;
                this.dir = dir; // Current direction vector
                this.nextDir = dir; // Queued 90-degree turn direction
                this.color = color;
                this.isBot = isBot;
                this.alive = true;
                this.score = 0;
                this.targetLength = 60; // Length in grid units
                
                // Continuous precise position on grid
                this.x = gridX * CELL_SIZE + CELL_SIZE / 2;
                this.y = gridY * CELL_SIZE + CELL_SIZE / 2;

                // Path turns points for continuous trail drawing
                this.path = [
                    { x: this.x, y: this.y }
                ];

                this.isBoosting = false;
                this.lastDraftTime = 0;
                this.lastCloseCallTime = 0;
                this.botTimer = 0;
            }

            setDirection(newDir) {
                // Prevent 180-degree immediate reversal
                if (newDir.x === -this.dir.x && newDir.y === -this.dir.y) return;
                this.nextDir = newDir;
            }

            update(dt) {
                if (!this.alive) return;

                // Check parallel proximity to boost
                this.checkDraftingAndBoost();

                const speed = this.isBoosting ? BOOST_SPEED : BASE_SPEED;
                const moveDist = speed * dt;

                let remaining = moveDist;

                while (remaining > 0 && this.alive) {
                    // Check if aligned with current cell center to execute queued turn
                    const currentCellX = Math.floor(this.x / CELL_SIZE) * CELL_SIZE + CELL_SIZE / 2;
                    const currentCellY = Math.floor(this.y / CELL_SIZE) * CELL_SIZE + CELL_SIZE / 2;

                    const distToCenter = Math.hypot(currentCellX - this.x, currentCellY - this.y);

                    // Execute turn if at or past cell center and direction queued
                    if (this.nextDir !== this.dir && distToCenter <= remaining + 2) {
                        this.x = currentCellX;
                        this.y = currentCellY;
                        this.dir = this.nextDir;
                        this.path.push({ x: this.x, y: this.y });
                        if (this === player) sound.turn();
                    }

                    // Move step
                    const step = Math.min(remaining, CELL_SIZE / 2);
                    this.x += this.dir.x * step;
                    this.y += this.dir.y * step;
                    remaining -= step;

                    // Update head node of path
                    if (this.path.length > 0) {
                        this.path[this.path.length - 1] = { x: this.x, y: this.y };
                    }

                    // Grid Bounds Collision Check
                    if (this.x < CELL_SIZE || this.x > WORLD_SIZE - CELL_SIZE || this.y < CELL_SIZE || this.y > WORLD_SIZE - CELL_SIZE) {
                        this.die('wall');
                        return;
                    }

                    // Check Body Collisions
                    this.checkCollisions();
                }

                // Trim path to maintain length limit
                this.trimPath();

                // Bot AI Logic
                if (this.isBot && isHost) {
                    this.updateBotAI(dt);
                }
            }

            checkDraftingAndBoost() {
                this.isBoosting = false;
                let closeToLine = false;

                for (let other of players) {
                    if (!other.alive) continue;
                    
                    // Check distance to other player's lines
                    for (let i = 0; i < other.path.length - 1; i++) {
                        const p1 = other.path[i];
                        const p2 = other.path[i + 1];
                        
                        const dist = distToSegment({ x: this.x, y: this.y }, p1, p2);

                        // Parallel riding zone (between 12px and 45px away)
                        if (dist > 10 && dist < 42) {
                            closeToLine = true;
                            break;
                        }
                    }
                    if (closeToLine) break;
                }

                if (closeToLine) {
                    this.isBoosting = true;
                    if (Date.now() - this.lastDraftTime > 500) {
                        this.targetLength += 0.8;
                        this.score += 5;
                        if (this === player) {
                            addFloatingText(this.x, this.y, '+5 BOOST', '#fcee0a');
                            sound.boost();
                        }
                        this.lastDraftTime = Date.now();
                    }
                }
            }

            checkCollisions() {
                const head = { x: this.x, y: this.y };

                for (let other of players) {
                    if (!other.alive) continue;

                    const segmentCount = other.path.length - 1;
                    for (let i = 0; i < segmentCount; i++) {
                        // Skip head segment of self to prevent self-instant crash
                        if (other === this && i >= segmentCount - 1) continue;

                        const p1 = other.path[i];
                        const p2 = other.path[i + 1];

                        const dist = distToSegment(head, p1, p2);

                        if (dist < 8) {
                            if (other === this) {
                                this.die('self');
                            } else {
                                // Kill awarded to other player
                                other.score += Math.floor(this.score * 0.5) + 300;
                                other.targetLength += Math.floor(this.targetLength * 0.3);

                                if (other === player) {
                                    addFloatingText(other.x, other.y, `+${Math.floor(this.score * 0.5) + 300} CUT KILL!`, '#00f3ff');
                                    sound.kill();
                                }
                                this.die('player', other);
                            }
                            return;
                        }

                        // Close Call Detection
                        if (dist >= 8 && dist < 22 && (Date.now() - this.lastCloseCallTime > 2500)) {
                            if (this === player) {
                                this.score += 30;
                                addFloatingText(this.x, this.y, '+30 CLOSE CALL!', '#ff0055');
                                sound.closeCall();
                            }
                            this.lastCloseCallTime = Date.now();
                        }
                    }
                }
            }

            trimPath() {
                let currentTotalLen = 0;
                for (let i = this.path.length - 1; i > 0; i--) {
                    const p1 = this.path[i];
                    const p2 = this.path[i - 1];
                    currentTotalLen += Math.hypot(p1.x - p2.x, p1.y - p2.y);
                }

                while (currentTotalLen > this.targetLength * CELL_SIZE && this.path.length > 2) {
                    const p0 = this.path[0];
                    const p1 = this.path[1];
                    const segLen = Math.hypot(p1.x - p0.x, p1.y - p0.y);
                    const excess = currentTotalLen - (this.targetLength * CELL_SIZE);

                    if (segLen <= excess) {
                        currentTotalLen -= segLen;
                        this.path.shift();
                    } else {
                        const ratio = (segLen - excess) / segLen;
                        this.path[0] = {
                            x: p1.x + (p0.x - p1.x) * ratio,
                            y: p1.y + (p0.y - p1.y) * ratio
                        };
                        break;
                    }
                }
            }

            updateBotAI(dt) {
                this.botTimer += dt;
                
                // Look ahead 3 grid cells
                const aheadX = this.x + this.dir.x * (CELL_SIZE * 3.5);
                const aheadY = this.y + this.dir.y * (CELL_SIZE * 3.5);

                let obstacle = (aheadX < CELL_SIZE * 2 || aheadX > WORLD_SIZE - CELL_SIZE * 2 || aheadY < CELL_SIZE * 2 || aheadY > WORLD_SIZE - CELL_SIZE * 2);

                if (!obstacle) {
                    for (let other of players) {
                        if (!other.alive) continue;
                        for (let i = 0; i < other.path.length - 1; i++) {
                            const p1 = other.path[i];
                            const p2 = other.path[i + 1];
                            if (distToSegment({ x: aheadX, y: aheadY }, p1, p2) < CELL_SIZE * 1.5) {
                                obstacle = true;
                                break;
                            }
                        }
                        if (obstacle) break;
                    }
                }

                if (obstacle || this.botTimer > 3.0) {
                    // Turn 90 degrees Left or Right
                    const possibleDirs = this.dir.x !== 0 
                        ? [DIR.UP, DIR.DOWN] 
                        : [DIR.LEFT, DIR.RIGHT];

                    // Choose safest direction
                    const choice = possibleDirs[Math.floor(Math.random() * possibleDirs.length)];
                    this.setDirection(choice);
                    this.botTimer = 0;
                }
            }

            die(reason, killer = null) {
                if (!this.alive) return;
                this.alive = false;

                if (this === player) sound.crash();

                // Explode particles
                for (let i = 0; i < 35; i++) {
                    particles.push(new Particle(this.x, this.y, this.color));
                }

                // Announce in killfeed
                if (reason === 'wall') {
                    pushKillfeed(`${this.name} 🧱 Wall`, 'wall');
                } else if (reason === 'self' || killer === this) {
                    pushKillfeed(`${this.name} ⚡ ${this.name}`, 'self');
                } else if (killer) {
                    pushKillfeed(`${killer.name} ⚡ ${this.name}`, 'kill');
                }

                if (this === player) {
                    triggerGameOver();
                } else if (isHost) {
                    setTimeout(() => {
                        if (!gameActive || !this.isBot) return;
                        respawnBot(this);
                    }, 2500);
                }
            }
        }

        // Helper: distance from point to segment
        function distToSegment(p, v, w) {
            const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
            if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 7;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = 0.025 + Math.random() * 0.03;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw(context) {
                context.save();
                context.globalAlpha = Math.max(0, this.life);
                context.fillStyle = this.color;
                context.shadowColor = this.color;
                context.shadowBlur = 8;
                context.fillRect(this.x - 2, this.y - 2, 4, 4);
                context.restore();
            }
        }

        let players = [];
        let particles = [];
        let floatingTexts = [];
        let player = null;
        let gameActive = false;

        function addFloatingText(x, y, text, color) {
            floatingTexts.push({ x, y, text, color, life: 1.0, vy: -1.2 });
        }

        function pushKillfeed(text, type) {
            const container = document.getElementById('killfeedContainer');
            const item = document.createElement('div');
            item.className = 'cyber-panel px-3 py-1.5 rounded-lg text-xs font-bold text-white border border-cyber-cyan/30 flex items-center space-x-2 animate-fade-in';
            
            let icon = '<i class="fa-solid fa-bolt text-cyber-yellow"></i>';
            if (type === 'wall') icon = '<i class="fa-solid fa-cube text-gray-400"></i>';
            if (type === 'kill') icon = '<i class="fa-solid fa-scissors text-cyber-pink"></i>';

            item.innerHTML = `${icon} <span>${text}</span>`;
            container.appendChild(item);

            setTimeout(() => {
                item.style.opacity = '0';
                item.style.transition = 'opacity 0.4s ease';
                setTimeout(() => item.remove(), 400);
            }, 3500);
        }

        let myPeer = null;
        let myPeerId = null;
        let isHost = false;
        let hostConnection = null;
        let clientConnections = [];
        let peerOrder = [];

        function updateStatus(msg) {
            document.getElementById('statusText').innerText = msg;
        }

        function updateRoleBadge() {
            const badge = document.getElementById('roleBadge');
            if (isHost) {
                badge.innerText = `HOST (${players.filter(p => !p.isBot).length} PLAYERS)`;
                badge.className = 'text-[9px] px-1.5 py-0.5 rounded bg-cyber-pink/20 border border-cyber-pink/40 text-cyber-pink';
            } else {
                badge.innerText = 'CLIENT PEER';
                badge.className = 'text-[9px] px-1.5 py-0.5 rounded bg-cyber-cyan/20 border border-cyber-cyan/40 text-cyber-cyan';
            }
        }

        const botNames = ['NeonGrid', 'Vector82', 'TronByte', 'CypherNode', 'ByteSlayer', 'NullPointer', 'GridGhost', 'LaserTail'];
        const botColors = ['#ff0055', '#fcee0a', '#a855f7', '#00ff66', '#f97316', '#3b82f6'];

        function respawnBot(botRider) {
            const gx = Math.floor(5 + Math.random() * (WORLD_SIZE / CELL_SIZE - 10));
            const gy = Math.floor(5 + Math.random() * (WORLD_SIZE / CELL_SIZE - 10));
            botRider.gridX = gx;
            botRider.gridY = gy;
            botRider.x = gx * CELL_SIZE + CELL_SIZE / 2;
            botRider.y = gy * CELL_SIZE + CELL_SIZE / 2;
            botRider.dir = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT][Math.floor(Math.random() * 4)];
            botRider.nextDir = botRider.dir;
            botRider.path = [{ x: botRider.x, y: botRider.y }];
            botRider.targetLength = 60;
            botRider.score = 0;
            botRider.alive = true;
        }

        function balanceBots() {
            if (!isHost) return;

            const humanCount = players.filter(p => !p.isBot).length;
            const currentBotCount = players.filter(p => p.isBot).length;
            const desiredBotCount = Math.max(1, TARGET_ROOM_CAPACITY - humanCount);

            if (currentBotCount < desiredBotCount) {
                for (let i = currentBotCount; i < desiredBotCount; i++) {
                    const gx = Math.floor(5 + Math.random() * (WORLD_SIZE / CELL_SIZE - 10));
                    const gy = Math.floor(5 + Math.random() * (WORLD_SIZE / CELL_SIZE - 10));
                    const dir = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT][Math.floor(Math.random() * 4)];
                    const name = botNames[Math.floor(Math.random() * botNames.length)];
                    const color = botColors[Math.floor(Math.random() * botColors.length)];
                    const botId = `bot_${Date.now()}_${Math.floor(Math.random() * 1000)}`;

                    players.push(new Rider(botId, name, gx, gy, dir, color, true));
                }
            } else if (currentBotCount > desiredBotCount) {
                let removed = 0;
                const toRemove = currentBotCount - desiredBotCount;
                for (let i = players.length - 1; i >= 0; i--) {
                    if (players[i].isBot && removed < toRemove) {
                        players.splice(i, 1);
                        removed++;
                    }
                }
            }
        }

        function initSeamlessNetwork(playerName, callback) {
            updateStatus('Connecting to Grid Peer Matrix...');
            myPeer = new Peer();

            myPeer.on('open', id => {
                myPeerId = id;
                attemptJoinOrHost(playerName, callback);
            });

            myPeer.on('error', err => {
                console.warn('Peer network exception, falling back to local host mode:', err);
                becomeHost(playerName, callback);
            });
        }

        function attemptJoinOrHost(playerName, callback) {
            updateStatus('Locating active Grid lobby...');
            const targetHostId = LOBBY_ID_PREFIX + '1';

            if (myPeerId === targetHostId) {
                becomeHost(playerName, callback);
                return;
            }

            let connected = false;
            const conn = myPeer.connect(targetHostId, { reliable: true });

            const connectionTimeout = setTimeout(() => {
                if (!connected) {
                    conn.close();
                    updateStatus('No lobby found. Registering as Grid Server...');
                    becomeHost(playerName, callback);
                }
            }, 2000);

            conn.on('open', () => {
                connected = true;
                clearTimeout(connectionTimeout);
                isHost = false;
                hostConnection = conn;
                updateStatus('Connected to Grid Server!');

                conn.send({
                    type: 'JOIN',
                    name: playerName,
                    peerId: myPeerId
                });

                setupClientListeners();
                if (callback) callback();
            });

            conn.on('error', () => {
                clearTimeout(connectionTimeout);
                becomeHost(playerName, callback);
            });
        }

        function becomeHost(playerName, callback) {
            isHost = true;
            if (myPeer && myPeerId !== LOBBY_ID_PREFIX + '1') {
                myPeer.destroy();
                myPeer = new Peer(LOBBY_ID_PREFIX + '1');

                myPeer.on('open', id => {
                    myPeerId = id;
                    setupHostServer(playerName, callback);
                });

                myPeer.on('error', () => {
                    myPeer = new Peer();
                    myPeer.on('open', id => {
                        myPeerId = id;
                        setupHostServer(playerName, callback);
                    });
                });
            } else {
                setupHostServer(playerName, callback);
            }
        }

        function setupHostServer(playerName, callback) {
            isHost = true;
            updateStatus('Grid Server Online!');

            myPeer.on('connection', conn => {
                clientConnections.push(conn);

                conn.on('data', data => {
                    handleHostData(conn, data);
                });

                conn.on('close', () => {
                    handleClientDisconnect(conn);
                });
            });

            if (callback) callback();
        }

        function handleHostData(conn, data) {
            if (data.type === 'JOIN') {
                const gx = Math.floor(5 + Math.random() * (WORLD_SIZE / CELL_SIZE - 10));
                const gy = Math.floor(5 + Math.random() * (WORLD_SIZE / CELL_SIZE - 10));
                const pRider = new Rider(data.peerId, data.name, gx, gy, DIR.RIGHT, '#ff0055', false);
                players.push(pRider);
                peerOrder.push(data.peerId);
                balanceBots();

                conn.send({ type: 'INIT_STATE', peerOrder });
            } else if (data.type === 'INPUT') {
                const p = players.find(playerObj => playerObj.id === data.peerId);
                if (p) {
                    p.setDirection(data.dir);
                }
            }
        }

        function handleClientDisconnect(conn) {
            clientConnections = clientConnections.filter(c => c !== conn);
            players = players.filter(p => p.id !== conn.peer);
            peerOrder = peerOrder.filter(id => id !== conn.peer);
            balanceBots();
        }

        function setupClientListeners() {
            hostConnection.on('data', data => {
                if (data.type === 'INIT_STATE') {
                    peerOrder = data.peerOrder;
                }
            });

            hostConnection.on('close', () => {
                updateStatus('Host re-rezzed! Performing seamless host migration...');
                setTimeout(() => {
                    attemptJoinOrHost(player.name, null);
                }, 1000);
            });
        }

        function drawGrid() {
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.08)';
            ctx.lineWidth = 1;

            const startX = Math.floor((camera.x - canvas.width / 2) / CELL_SIZE) * CELL_SIZE;
            const endX = startX + canvas.width + CELL_SIZE * 2;
            const startY = Math.floor((camera.y - canvas.height / 2) / CELL_SIZE) * CELL_SIZE;
            const endY = startY + canvas.height + CELL_SIZE * 2;

            ctx.beginPath();
            for (let x = startX; x <= endX; x += CELL_SIZE) {
                ctx.moveTo(x, startY);
                ctx.lineTo(x, endY);
            }
            for (let y = startY; y <= endY; y += CELL_SIZE) {
                ctx.moveTo(startX, y);
                ctx.lineTo(endX, y);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawWorldBounds() {
            ctx.save();
            ctx.strokeStyle = '#00f3ff';
            ctx.shadowColor = '#00f3ff';
            ctx.shadowBlur = 15;
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);
            ctx.restore();
        }

        function drawMinimap() {
            minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            minimapCtx.fillStyle = '#02040a';
            minimapCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);

            const scale = minimapCanvas.width / WORLD_SIZE;

            minimapCtx.strokeStyle = 'rgba(0, 243, 255, 0.4)';
            minimapCtx.strokeRect(0, 0, minimapCanvas.width, minimapCanvas.height);

            for (let p of players) {
                if (!p.alive) continue;
                minimapCtx.fillStyle = p === player ? '#00f3ff' : (p.isBot ? '#fcee0a' : '#ff0055');
                minimapCtx.fillRect(p.x * scale - 2, p.y * scale - 2, 4, 4);
            }
        }

        function updateLeaderboard() {
            const sorted = [...players].sort((a,b) => b.score - a.score);
            const list = document.getElementById('leaderboardList');
            list.innerHTML = '';

            sorted.slice(0, 6).forEach((p, index) => {
                const row = document.createElement('div');
                row.className = `flex justify-between items-center px-2 py-0.5 rounded ${p === player ? 'bg-cyber-cyan/20 text-cyber-cyan font-bold border border-cyber-cyan/30' : 'text-gray-300'}`;
                
                const icon = p.isBot ? '<i class="fa-solid fa-robot text-cyber-yellow mr-1" title="Bot"></i>' : '<i class="fa-solid fa-user text-cyber-cyan mr-1" title="Player"></i>';

                row.innerHTML = `<span class="flex items-center text-[11px]">${index + 1}. ${icon} ${p.name}</span><span class="font-bold text-[11px]">${p.score}</span>`;
                list.appendChild(row);
            });
        }

        function initGame(playerName) {
            players = [];
            particles = [];
            floatingTexts = [];

            const gx = Math.floor(10 + Math.random() * (WORLD_SIZE / CELL_SIZE - 20));
            const gy = Math.floor(10 + Math.random() * (WORLD_SIZE / CELL_SIZE - 20));

            player = new Rider(myPeerId || 'local_player', playerName, gx, gy, DIR.RIGHT, '#00f3ff', false);
            players.push(player);

            if (isHost) {
                balanceBots();
            }

            gameActive = true;
            document.getElementById('menuModal').classList.add('hidden');
            document.getElementById('gameOverModal').classList.add('hidden');
            
            let lastTimestamp = performance.now();
            
            function gameLoop(now) {
                const dt = Math.min((now - lastTimestamp) / 1000, 0.08);
                lastTimestamp = now;

                if (gameActive) {
                    // Camera update
                    camera.update(player.x, player.y);

                    // Update Riders
                    for (let p of players) {
                        p.update(dt);
                    }

                    // Update Particles
                    for (let i = particles.length - 1; i >= 0; i--) {
                        particles[i].update();
                        if (particles[i].life <= 0) particles.splice(i, 1);
                    }

                    // Update Floating Texts
                    for (let i = floatingTexts.length - 1; i >= 0; i--) {
                        let ft = floatingTexts[i];
                        ft.y += ft.vy;
                        ft.life -= 0.02;
                        if (ft.life <= 0) floatingTexts.splice(i, 1);
                    }

                    // Update HUD
                    document.getElementById('hudScore').innerText = player.score;
                    document.getElementById('hudLength').innerText = Math.floor(player.targetLength);
                    updateLeaderboard();
                    updateRoleBadge();
                }

                // Render Canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.translate(canvas.width / 2 - camera.x, canvas.height / 2 - camera.y);

                drawGrid();
                drawWorldBounds();

                // Render Rider Line Trails (Strict 90-degree segment rendering)
                for (let p of players) {
                    if (p.path.length > 1) {
                        ctx.save();
                        ctx.strokeStyle = p.color;
                        ctx.shadowColor = p.color;
                        ctx.shadowBlur = p.isBoosting ? 18 : 8;
                        ctx.lineWidth = p.isBoosting ? 5 : 4;
                        ctx.lineCap = 'square';
                        ctx.lineJoin = 'miter';

                        ctx.beginPath();
                        ctx.moveTo(p.path[0].x, p.path[0].y);
                        for (let i = 1; i < p.path.length; i++) {
                            ctx.lineTo(p.path[i].x, p.path[i].y);
                        }
                        ctx.stroke();
                        ctx.restore();
                    }
                }

                // Render Rider Heads
                for (let p of players) {
                    if (!p.alive) continue;
                    ctx.save();
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 12;
                    ctx.fillRect(p.x - CELL_SIZE / 2, p.y - CELL_SIZE / 2, CELL_SIZE, CELL_SIZE);
                    
                    // Eye/Front indicator
                    ctx.fillStyle = '#ffffff';
                    const eyeSize = 4;
                    ctx.fillRect(
                        p.x + p.dir.x * 4 - eyeSize / 2, 
                        p.y + p.dir.y * 4 - eyeSize / 2, 
                        eyeSize, 
                        eyeSize
                    );
                    ctx.restore();
                }

                // Render Particles
                for (let pt of particles) {
                    pt.draw(ctx);
                }

                // Render Floating Score Texts
                for (let ft of floatingTexts) {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, ft.life);
                    ctx.font = 'bold 14px Orbitron';
                    ctx.fillStyle = ft.color;
                    ctx.shadowColor = ft.color;
                    ctx.shadowBlur = 8;
                    ctx.fillText(ft.text, ft.x - 20, ft.y);
                    ctx.restore();
                }

                ctx.restore();

                drawMinimap();

                requestAnimationFrame(gameLoop);
            }

            requestAnimationFrame(gameLoop);
        }

        function triggerGameOver() {
            gameActive = false;
            document.getElementById('finalScore').innerText = player.score;
            document.getElementById('finalLength').innerText = Math.floor(player.targetLength);
            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        window.addEventListener('keydown', e => {
            if (!player || !player.alive) return;

            let turnDir = null;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') turnDir = DIR.UP;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') turnDir = DIR.DOWN;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') turnDir = DIR.LEFT;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') turnDir = DIR.RIGHT;

            if (turnDir) {
                player.setDirection(turnDir);
                if (!isHost && hostConnection) {
                    hostConnection.send({
                        type: 'INPUT',
                        peerId: myPeerId,
                        dir: turnDir
                    });
                }
            }
        });

        // Touch Swipe Gesture Support
        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('touchstart', e => {
            if (e.touches.length > 0) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchend', e => {
            if (!player || !player.alive || e.changedTouches.length === 0) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;

            let turnDir = null;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 20) turnDir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
            } else {
                if (Math.abs(dy) > 20) turnDir = dy > 0 ? DIR.DOWN : DIR.UP;
            }

            if (turnDir) {
                player.setDirection(turnDir);
                if (!isHost && hostConnection) {
                    hostConnection.send({
                        type: 'INPUT',
                        peerId: myPeerId,
                        dir: turnDir
                    });
                }
            }
        });

        // Event Listeners
        document.getElementById('playBtn').addEventListener('click', () => {
            sound.init();
            const name = document.getElementById('playerNameInput').value.trim() || 'Rider_99';
            document.getElementById('playBtnText').innerText = 'INITIALIZING...';

            initSeamlessNetwork(name, () => {
                initGame(name);
            });
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            const name = document.getElementById('playerNameInput').value.trim() || 'Rider_99';
            initGame(name);
        });
    </script>
</body>
