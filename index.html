<!DOCTYPE html>
<html>
<head>
    <title>Dispatch Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="window">

    <div class="titlebar">
        Dispatch Terminal
        <span id="clock">CALL 00:00</span>
    </div>


    <div class="tabs" id="tabs">

        <button onclick="newCall()">
            +
        </button>

    </div>


    <div id="content" class="hidden">

        <div class="progress">
            <div id="progressBar"></div>
        </div>


        <div class="columns">


            <div class="panel">

                <div class="panelTitle">
                    Incident Log
                </div>

                <pre id="log">
No information entered.
                </pre>

            </div>



            <div class="panel">

                <div class="panelTitle">
                    Current Question
                </div>


                <div id="question">
                    
                </div>


                <input
                    id="input"
                    autofocus
                >


                <small>
                    ENTER - Continue
                </small>

                <div id="transmitArea" class="transmitArea hidden">
                    <button id="transmitBtn" type="button">Transmit Dispatch</button>
                    <div id="status" class="status"></div>
                    <audio id="replay" controls hidden></audio>
                </div>

            </div>


        </div>

    </div>


    <div id="start" class="start">

        <h3>Select Incident</h3>

        <button onclick="createCall('crime')">
            1 - Crime
        </button>

        <button onclick="createCall('medical')">
            2 - Medical Emergency
        </button>

        <button onclick="createCall('fire')">
            3 - Fire Emergency
        </button>

    </div>


</div>


<script src="script.js"></script>

</body>
</html>
