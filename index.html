<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Powerline.io</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050b14;
            color: #fff;
        }

        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #060d1a;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 11, 20, 0.75);
            backdrop-filter: blur(8px);
            z-index: 10;
            pointer-events: auto;
        }

        .menu-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 450px;
            width: 90%;
            text-align: center;
        }

        #game-logo {
            max-width: 380px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(255, 0, 128, 0.6));
        }

        .logo-fallback {
            font-size: 3rem;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, #ff007f, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: none;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #00f0ff;
            text-transform: uppercase;
            font-weight: 700;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 2px solid #00f0ff;
            background: rgba(6, 20, 40, 0.8);
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            transition: all 0.2s ease;
            user-select: text;
            -webkit-user-select: text;
            touch-action: manipulation;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            border-color: #39ff14;
        }

        .btn-play {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #39ff14, #00b300);
            color: #050b14;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            touch-action: manipulation;
        }

        .btn-play:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.8);
        }

        .btn-play:active {
            transform: scale(0.98);
        }

        .btn-play:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status-text {
            font-size: 0.9rem;
            color: #a0aec0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ffaa00;
            box-shadow: 0 0 8px #ffaa00;
            flex-shrink: 0;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(5, 11, 20, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            min-width: 200px;
            backdrop-filter: blur(4px);
            pointer-events: auto;
        }

        #leaderboard h3 {
            font-size: 0.85rem;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 4px;
        }

        .lb-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            margin-bottom: 4px;
            font-weight: 600;
            gap: 10px;
        }

        .lb-entry.me {
            color: #39ff14;
        }

        .lb-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            flex-shrink: 0;
        }

        #killfeed {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column-reverse;
            gap: 6px;
            max-height: 200px;
            overflow: hidden;
            pointer-events: none;
        }

        .kf-item {
            background: rgba(5, 11, 20, 0.8);
            border-left: 3px solid #ff0055;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        #death-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 11, 20, 0.85);
            backdrop-filter: blur(6px);
            z-index: 9;
            pointer-events: auto;
        }

        .death-card {
            background: rgba(10, 20, 35, 0.9);
            border: 2px solid #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.3);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .death-title {
            color: #ff0055;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 10px 0;
        }

        .stat-box {
            background: rgba(5, 11, 20, 0.6);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: #00f0ff;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #a0aec0;
            text-transform: uppercase;
        }

        #minimap-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 140px;
            background: rgba(5, 11, 20, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
            pointer-events: none;
        }

        #minimap {
            width: 100%;
            height: 100%;
        }

        /* ---- Mobile touch controls ---- */
        #joystick-zone {
            position: absolute;
            bottom: max(30px, env(safe-area-inset-bottom));
            left: 30px;
            width: 130px;
            height: 130px;
            display: none;
            pointer-events: auto;
            z-index: 8;
        }

        #joystick-base {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(6, 20, 40, 0.55);
            border: 2px solid rgba(0, 240, 255, 0.35);
        }

        #joystick-knob {
            position: absolute;
            top: 50%; left: 50%;
            width: 56px;
            height: 56px;
            margin-left: -28px;
            margin-top: -28px;
            border-radius: 50%;
            background: rgba(57, 255, 20, 0.75);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.6);
            transition: transform 0.03s linear;
        }

        .touch-device #joystick-zone {
            display: block;
        }

        @media (max-width: 640px), (pointer: coarse) {
            #leaderboard {
                top: 12px;
                right: 12px;
                min-width: 150px;
                padding: 8px 10px;
                font-size: 0.85em;
            }
            #minimap-container {
                width: 90px;
                height: 90px;
                top: 12px;
            }
            #killfeed {
                bottom: 170px;
                left: 12px;
                max-width: 60vw;
            }
            .kf-item { font-size: 0.75rem; padding: 4px 8px; }
            #game-logo { max-width: 260px; }
            .logo-fallback { font-size: 2rem; }
            .menu-content { gap: 14px; }
            .death-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="menu-screen">
        <div class="menu-content">
            <img src="logo.png" alt="Powerline.io" id="game-logo" onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='block';">
            <div class="logo-fallback">POWERLINE.IO</div>

            <div class="input-group">
                <label for="nickname">Enter Nickname</label>
                <input type="text" id="nickname" maxlength="15" value="PowerRider" placeholder="Player Name" />
            </div>

            <button class="btn-play" id="play-btn">PLAY NOW</button>

            <div class="status-text">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-msg">Searching for active game...</span>
            </div>
        </div>
    </div>

    <div id="death-screen">
        <div class="death-card">
            <div class="death-title">CIRCUIT SHORTED</div>
            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-value" id="final-score">0</div>
                    <div class="stat-label">Final Score</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="final-length">0</div>
                    <div class="stat-label">Peak Length</div>
                </div>
            </div>
            <button class="btn-play" id="respawn-btn">PLAY AGAIN</button>
        </div>
    </div>

    <div class="overlay">
        <div id="minimap-container">
            <canvas id="minimap" width="140" height="140"></canvas>
        </div>

        <div id="leaderboard">
            <h3>Leaderboard</h3>
            <div id="lb-list"></div>
        </div>

        <div id="killfeed"></div>
    </div>

    <div id="joystick-zone">
        <div id="joystick-base"></div>
        <div id="joystick-knob"></div>
    </div>

    <script>
        const WORLD_SIZE = 4000;
        const BASE_SPEED = 3.8;
        const BOOST_SPEED = 7.5;
        const LINE_WIDTH = 10;
        const GRID_SPACING = 40;
        const MIN_SAFE_DIST = 300;
        const BOT_TARGET_COUNT = 8;
        const HOST_ROOM_ID = 'powerline-global-v3-room';

        // Shared color/name pool -- players and bots draw from the exact same
        // pools so there is no visual or textual way to tell them apart.
        const RIDER_COLORS = [
            '#39ff14', '#00f0ff', '#ff0055', '#ffaa00', '#ff007f',
            '#a0ff00', '#00ffaa', '#ff5500', '#c400ff', '#ffe600',
            '#00aaff', '#ff3355'
        ];
        const RIDER_NAMES = ['CinoSaval', 'Tiawo', 'Tiapon', 'Xhishua', 'Xhanilla', 'Xiaota', 'Porxioa', 'Miwau',
            'Tempala', 'Dhucai', 'Alapan', 'Xiaoxiao', 'Dompala', 'Jip', 'Indypol', 'HPax', 'Halpal', 'Scram',
            'Hezo', 'Luwow', 'Swoon', 'Paxolon', 'Scraper', 'Narnia', 'XK2', 'Ento', 'Extrapol'];

        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function randRange(a, b) { return a + Math.random() * (b - a); }

        // ============================================================
        // PEERJS LOADER -- try several CDNs so a single blocked/unreachable
        // host (ad-blocker, regional block, transient outage) can't take the
        // whole game down with an uncaught "Peer is not defined" error.
        // ============================================================
        const PEERJS_SOURCES = [
            'https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js',
            'https://cdn.jsdelivr.net/npm/[email protected]/dist/peerjs.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js'
        ];

        function loadScriptOnce(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.async = true;
                s.onload = () => resolve(src);
                s.onerror = () => reject(new Error('failed to load ' + src));
                document.head.appendChild(s);
            });
        }

        async function ensurePeerJsLoaded() {
            if (typeof Peer !== 'undefined') return true;
            for (const src of PEERJS_SOURCES) {
                try {
                    await loadScriptOnce(src);
                    if (typeof Peer !== 'undefined') return true;
                } catch (e) {
                    console.warn('Networking library failed to load from', src);
                }
            }
            return typeof Peer !== 'undefined';
        }

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap');
        const mctx = minimapCanvas.getContext('2d');

        let camera = { x: WORLD_SIZE / 2, y: WORLD_SIZE / 2 };
        let myId = null;
        let isPlaying = false;
        let myPlayer = null;

        let players = {};
        let foodPellets = [];
        let sparkParticles = [];

        const keys = {};

        // ============================================================
        // PLAYER / BOT ENTITY
        // ============================================================
        class Player {
            constructor(id, name, x, y, isBot = false) {
                this.id = id;
                this.name = name || 'Rider';
                this.isBot = isBot;
                this.dir = { x: 1, y: 0 };
                this.nextDir = { x: 1, y: 0 };
                this.speed = BASE_SPEED;
                this.isBoosting = false;
                this.score = 0;
                this.alive = true;
                this.color = pick(RIDER_COLORS);

                this.path = [];
                const initialLength = 40;
                for (let i = 0; i < initialLength; i++) {
                    this.path.push({ x: x - i * 2, y: y });
                }

                // --- AI personality/state (bots only) ---
                if (isBot) {
                    const roll = Math.random();
                    let type = 'wanderer';
                    if (roll < 0.30) type = 'follower';
                    else if (roll < 0.60) type = 'aggressive';
                    else if (roll < 0.80) type = 'skirmisher';
                    this.ai = {
                        type,
                        aggression: randRange(0.3, 1),
                        loyalty: randRange(0.25, 1),
                        wildness: randRange(0.1, 1),
                        mistakeChance: randRange(0.01, 0.07),
                        reengageIn: Math.floor(randRange(20, 70)),
                        wanderDir: null,
                        targetId: null,
                        pendingDir: null,
                        pendingFrames: 0
                    };
                }
            }

            get head() {
                return this.path[0];
            }

            update() {
                if (!this.alive) return;

                // apply a delayed ("reaction time") direction change for bots that
                // are mid-hesitation, instead of turning instantly
                if (this.isBot && this.ai.pendingDir && this.ai.pendingFrames > 0) {
                    this.ai.pendingFrames--;
                    if (this.ai.pendingFrames <= 0) {
                        this.nextDir = this.ai.pendingDir;
                        this.ai.pendingDir = null;
                    }
                }

                if ((this.nextDir.x !== 0 && this.nextDir.x !== -this.dir.x) ||
                    (this.nextDir.y !== 0 && this.nextDir.y !== -this.dir.y)) {
                    this.dir = { ...this.nextDir };
                }

                if (this.isBot) {
                    this.updateBot();
                }

                this.checkBoosting();

                const newHead = {
                    x: this.head.x + this.dir.x * this.speed,
                    y: this.head.y + this.dir.y * this.speed
                };

                this.path.unshift(newHead);

                const targetPathLength = Math.floor(40 + (this.score / 2));
                while (this.path.length > targetPathLength) {
                    this.path.pop();
                }

                if (newHead.x < 0 || newHead.x > WORLD_SIZE || newHead.y < 0 || newHead.y > WORLD_SIZE) {
                    killPlayer(this, null, 'wall');
                    return;
                }

                for (let i = foodPellets.length - 1; i >= 0; i--) {
                    const p = foodPellets[i];
                    if (Math.hypot(newHead.x - p.x, newHead.y - p.y) < LINE_WIDTH + p.size) {
                        this.score += p.val;
                        foodPellets.splice(i, 1);
                        if (Net.isHost && foodPellets.length < 200) {
                            spawnPellet();
                        }
                    }
                }

                this.checkCollisions();
            }

            checkBoosting() {
                let boosting = false;
                const boostDistThreshold = 35;

                for (let pid in players) {
                    const other = players[pid];
                    if (!other.alive || other.id === this.id) continue;

                    for (let i = 0; i < other.path.length - 5; i += 4) {
                        const pt = other.path[i];
                        if (Math.hypot(this.head.x - pt.x, this.head.y - pt.y) < boostDistThreshold) {
                            boosting = true;
                            if (Math.random() < 0.4) {
                                sparkParticles.push({
                                    x: this.head.x + (Math.random() - 0.5) * 10,
                                    y: this.head.y + (Math.random() - 0.5) * 10,
                                    vx: (Math.random() - 0.5) * 4,
                                    vy: (Math.random() - 0.5) * 4,
                                    life: 1.0,
                                    color: '#00f0ff'
                                });
                            }
                            break;
                        }
                    }
                    if (boosting) break;
                }

                this.isBoosting = boosting;
                this.speed = boosting ? BOOST_SPEED : BASE_SPEED;
                if (boosting) this.score += 0.1;
            }

            checkCollisions() {
                const head = this.head;

                for (let pid in players) {
                    const other = players[pid];
                    if (!other.alive) continue;

                    const startIndex = (other.id === this.id) ? 25 : 0;

                    for (let i = startIndex; i < other.path.length - 1; i += 2) {
                        const p1 = other.path[i];
                        if (Math.hypot(head.x - p1.x, head.y - p1.y) < LINE_WIDTH * 0.85) {
                            killPlayer(this, other, other.id === this.id ? 'self' : 'player');
                            return;
                        }
                    }
                }
            }

            // ============================================================
            // HUMANIZED BOT AI
            // ============================================================
            updateBot() {
                const ai = this.ai;

                // find current leader (highest score, alive)
                let leader = null, topScore = -1;
                for (let pid in players) {
                    if (players[pid].alive && players[pid].score > topScore) {
                        topScore = players[pid].score;
                        leader = players[pid];
                    }
                }
                const amLeader = leader && leader.id === this.id;

                // periodically re-decide what this bot is "trying" to do, rather
                // than recomputing a perfect optimal choice every single frame --
                // this is what makes the behavior feel intentional but not robotic
                ai.reengageIn--;
                if (ai.reengageIn <= 0) {
                    ai.reengageIn = Math.floor(randRange(25, 80));
                    ai.targetId = null; // drop old target, re-evaluate below
                }

                let wantedDir = this.dir;

                if (amLeader) {
                    wantedDir = this.leaderBehavior();
                } else if (ai.type === 'follower' && leader && Math.random() < ai.loyalty * 0.6) {
                    wantedDir = this.followBehavior(leader);
                } else if ((ai.type === 'aggressive' || ai.type === 'skirmisher') && Math.random() < ai.aggression * 0.55) {
                    wantedDir = this.attackBehavior();
                } else if (Math.random() < 0.45) {
                    wantedDir = this.seekFoodBehavior();
                } else {
                    wantedDir = this.wanderBehavior();
                }

                // "faltering": bots aren't perfect -- occasionally ignore their
                // plan and flinch in a random direction, or hesitate before
                // committing to a turn (simulated reaction delay)
                const possibleDirs = this.dir.x !== 0 ?
                    [{ x: 0, y: 1 }, { x: 0, y: -1 }] :
                    [{ x: 1, y: 0 }, { x: -1, y: 0 }];

                if (Math.random() < ai.mistakeChance + ai.wildness * 0.02) {
                    wantedDir = pick(possibleDirs);
                }

                let safeDir = null;
                for (let candidate of [wantedDir, ...possibleDirs, this.dir]) {
                    if (!candidate) continue;
                    if ((candidate.x !== 0 && candidate.x === -this.dir.x) ||
                        (candidate.y !== 0 && candidate.y === -this.dir.y)) continue;

                    const testX = this.head.x + candidate.x * 60;
                    const testY = this.head.y + candidate.y * 60;

                    let unsafe = testX < 60 || testX > WORLD_SIZE - 60 || testY < 60 || testY > WORLD_SIZE - 60;

                    if (!unsafe) {
                        for (let pid in players) {
                            const other = players[pid];
                            if (!other.alive) continue;
                            const start = (other.id === this.id) ? 20 : 0;
                            for (let i = start; i < other.path.length; i += 6) {
                                if (Math.hypot(testX - other.path[i].x, testY - other.path[i].y) < 45) {
                                    unsafe = true;
                                    break;
                                }
                            }
                            if (unsafe) break;
                        }
                    }

                    if (!unsafe) {
                        safeDir = candidate;
                        break;
                    }
                }

                if (safeDir) {
                    // occasionally hesitate for a few frames before actually
                    // turning, instead of reacting instantly like a machine
                    if ((safeDir.x !== this.dir.x || safeDir.y !== this.dir.y) &&
                        Math.random() < 0.35 && ai.pendingFrames <= 0) {
                        ai.pendingDir = safeDir;
                        ai.pendingFrames = Math.floor(randRange(1, 7));
                    } else {
                        this.nextDir = safeDir;
                    }
                }
            }

            seekFoodBehavior() {
                let nearest = null, nearestDist = 500;
                for (const p of foodPellets) {
                    const d = Math.hypot(this.head.x - p.x, this.head.y - p.y);
                    if (d < nearestDist) { nearestDist = d; nearest = p; }
                }
                if (!nearest) return this.wanderBehavior();
                const dx = nearest.x - this.head.x, dy = nearest.y - this.head.y;
                return Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) };
            }

            wanderBehavior() {
                const ai = this.ai;
                // occasionally pick a fresh lazy direction and stick with it a while,
                // like someone idly cruising rather than pathing purposefully
                if (!ai.wanderDir || Math.random() < 0.03 * ai.wildness + 0.005) {
                    ai.wanderDir = Math.random() < 0.5 ? { x: Math.sign(Math.random() - 0.5) || 1, y: 0 } : { x: 0, y: Math.sign(Math.random() - 0.5) || 1 };
                }
                return ai.wanderDir;
            }

            followBehavior(leader) {
                // trail the leader, but not perfectly -- add noise so the pack
                // spreads out instead of forming a straight conga line
                const noiseX = leader.head.x + (Math.random() - 0.5) * 220;
                const noiseY = leader.head.y + (Math.random() - 0.5) * 220;
                const dx = noiseX - this.head.x, dy = noiseY - this.head.y;
                if (Math.hypot(dx, dy) < 40) return this.wanderBehavior();
                return Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) };
            }

            attackBehavior() {
                const ai = this.ai;
                let target = ai.targetId ? players[ai.targetId] : null;
                if (!target || !target.alive) {
                    // pick the nearest viable rival within range to pick a fight with
                    let nearest = null, nearestDist = 500;
                    for (let pid in players) {
                        const other = players[pid];
                        if (!other.alive || other.id === this.id) continue;
                        const d = Math.hypot(this.head.x - other.head.x, this.head.y - other.head.y);
                        if (d < nearestDist) { nearestDist = d; nearest = other; }
                    }
                    target = nearest;
                    ai.targetId = target ? target.id : null;
                }
                if (!target) return this.seekFoodBehavior();

                // aim slightly ahead of the target's current heading to try to
                // cut across their path rather than chasing their tail
                const leadX = target.head.x + target.dir.x * 50;
                const leadY = target.head.y + target.dir.y * 50;
                const dx = leadX - this.head.x, dy = leadY - this.head.y;
                return Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) };
            }

            leaderBehavior() {
                const ai = this.ai;
                // the leader gets antsy: it tries to box in nearby smaller
                // followers who are trailing it, and otherwise moves a bit
                // more erratically to make itself a harder target
                let follower = null, followerDist = 260;
                for (let pid in players) {
                    const other = players[pid];
                    if (!other.alive || other.id === this.id) continue;
                    if (other.score >= this.score) continue;
                    const d = Math.hypot(this.head.x - other.head.x, this.head.y - other.head.y);
                    if (d < followerDist) { followerDist = d; follower = other; }
                }

                if (follower && Math.random() < 0.4) {
                    // steer to cut across the follower's forward path, boxing them
                    const boxX = follower.head.x + follower.dir.x * 70 - follower.dir.y * 40;
                    const boxY = follower.head.y + follower.dir.y * 70 + follower.dir.x * 40;
                    const dx = boxX - this.head.x, dy = boxY - this.head.y;
                    return Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) };
                }

                // widen the berth with a little extra wildness so followers
                // can't easily predict/trap the leader
                if (Math.random() < 0.12 + ai.wildness * 0.08) {
                    const possibleDirs = this.dir.x !== 0 ?
                        [{ x: 0, y: 1 }, { x: 0, y: -1 }] :
                        [{ x: 1, y: 0 }, { x: -1, y: 0 }];
                    return pick(possibleDirs);
                }

                return this.seekFoodBehavior();
            }
        }

        function findSafeSpawn() {
            let attempt = 0;
            while (attempt < 100) {
                const x = 300 + Math.random() * (WORLD_SIZE - 600);
                const y = 300 + Math.random() * (WORLD_SIZE - 600);

                let safe = true;
                for (let pid in players) {
                    const p = players[pid];
                    if (p.alive && Math.hypot(p.head.x - x, p.head.y - y) < MIN_SAFE_DIST) {
                        safe = false;
                        break;
                    }
                }
                if (safe) return { x, y };
                attempt++;
            }
            return { x: WORLD_SIZE / 2, y: WORLD_SIZE / 2 };
        }

        function killPlayer(victim, killer, cause) {
            if (!victim.alive) return;
            victim.alive = false;

            for (let i = 0; i < victim.path.length; i += 3) {
                const pt = victim.path[i];
                foodPellets.push({
                    x: pt.x + (Math.random() - 0.5) * 20,
                    y: pt.y + (Math.random() - 0.5) * 20,
                    color: i % 2 === 0 ? '#ff3300' : '#ff9900',
                    size: 4 + Math.random() * 4,
                    val: 3
                });
            }

            let msg = '';
            if (cause === 'wall') {
                msg = `<b>${victim.name}</b> hit a wall`;
            } else if (cause === 'self') {
                msg = `<b>${victim.name}</b> tangled itself up`;
            } else if (killer) {
                msg = `<b>${killer.name}</b> ⚡ <b>${victim.name}</b>`;
                killer.score += 50;
            }
            addKillfeed(msg);

            if (victim.id === myId) {
                document.getElementById('final-score').innerText = Math.floor(victim.score);
                document.getElementById('final-length').innerText = victim.path.length;
                document.getElementById('death-screen').style.display = 'flex';
            }

            if (Net.isHost && victim.isBot) {
                delete players[victim.id];
                setTimeout(() => {
                    if (Net.isHost && Object.keys(players).length < BOT_TARGET_COUNT) {
                        spawnBot();
                    }
                }, 3000);
            }
        }

        function addKillfeed(htmlContent) {
            const kf = document.getElementById('killfeed');
            const item = document.createElement('div');
            item.className = 'kf-item';
            item.innerHTML = htmlContent;
            kf.appendChild(item);
            setTimeout(() => item.remove(), 5000);
        }

        function spawnBot() {
            const botId = 'bot_' + Math.random().toString(36).substr(2, 6);
            const name = pick(RIDER_NAMES);
            const pos = findSafeSpawn();
            players[botId] = new Player(botId, name, pos.x, pos.y, true);
        }

        function spawnPellet() {
            foodPellets.push({
                x: Math.random() * WORLD_SIZE,
                y: Math.random() * WORLD_SIZE,
                color: Math.random() < 0.5 ? '#ff9900' : '#ffff00',
                size: 3 + Math.random() * 3,
                val: 1
            });
        }

        // ============================================================
        // NETWORKING -- robust host election, migration and reconnect
        // ============================================================
        function setStatus(msg, state) {
            const el = document.getElementById('status-msg');
            const dot = document.getElementById('status-dot');
            if (el) el.innerText = msg;
            if (dot) {
                const color = state === 'ok' ? '#39ff14' : (state === 'err' ? '#ff0055' : '#ffaa00');
                dot.style.backgroundColor = color;
                dot.style.boxShadow = `0 0 8px ${color}`;
            }
        }

        const Net = {
            peer: null,
            hostConn: null,
            isHost: false,
            connections: {},
            reconnectAttempts: 0,
            useRelayOnly: false,
            lastSyncTime: 0,
            hostWatchdog: null,
            broadcastInterval: null,
            starting: false,

            peerConfig() {
                return {
                    secure: true,
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' },
                            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
                            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' },
                            { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelay', credential: 'openrelay' }
                        ],
                        iceTransportPolicy: this.useRelayOnly ? 'relay' : 'all'
                    }
                };
            },

            start() {
                if (this.starting) return;
                this.starting = true;
                this.tryBecomeHostOrConnect();
            },

            teardown() {
                this.stopWatchdog();
                if (this.broadcastInterval) { clearInterval(this.broadcastInterval); this.broadcastInterval = null; }
                if (this.hostConn) { try { this.hostConn.close(); } catch (e) {} this.hostConn = null; }
                if (this.peer) { try { this.peer.destroy(); } catch (e) {} this.peer = null; }
                this.connections = {};
            },

            tryBecomeHostOrConnect() {
                setStatus('Searching for active game...', 'wait');
                const p = new Peer(HOST_ROOM_ID, this.peerConfig());
                this.peer = p;
                let settled = false;

                p.on('open', (id) => {
                    settled = true;
                    myId = id;
                    this.isHost = true;
                    this.reconnectAttempts = 0;
                    this.becomeHostSetup();
                });

                p.on('error', (err) => {
                    if (settled) return;
                    if (err && err.type === 'unavailable-id') {
                        try { p.destroy(); } catch (e) {}
                        this.connectAsClient();
                    } else {
                        this.scheduleRetry();
                    }
                });

                p.on('disconnected', () => {
                    if (p && !p.destroyed) p.reconnect();
                });
            },

            connectAsClient() {
                setStatus('Connecting to host...', 'wait');
                const p = new Peer(this.peerConfig());
                this.peer = p;

                p.on('open', (id) => {
                    myId = id;
                    this.isHost = false;
                    this.reconnectAttempts = 0;
                    this.connectToHost();
                });

                p.on('error', () => {
                    this.scheduleRetry();
                });

                p.on('disconnected', () => {
                    if (p && !p.destroyed) p.reconnect();
                });
            },

            connectToHost() {
                if (!this.peer || this.peer.destroyed) return;
                const conn = this.peer.connect(HOST_ROOM_ID, { reliable: true });
                this.hostConn = conn;
                let opened = false;

                const timeout = setTimeout(() => {
                    if (!opened) {
                        try { conn.close(); } catch (e) {}
                        this.useRelayOnly = true;
                        this.scheduleRetry(500);
                    }
                }, 5000);

                conn.on('open', () => {
                    opened = true;
                    clearTimeout(timeout);
                    this.reconnectAttempts = 0;
                    this.lastSyncTime = Date.now();
                    setStatus('Connected!', 'ok');
                    if (isPlaying && myPlayer) {
                        myPlayer.id = myId;
                        players[myId] = myPlayer;
                        this.announceJoin(myPlayer.name);
                    }
                    this.startWatchdog();
                });

                conn.on('data', (data) => this.handleHostData(data));

                conn.on('close', () => {
                    clearTimeout(timeout);
                    if (this.isHost) return;
                    setStatus('Host lost. Reconnecting...', 'wait');
                    this.stopWatchdog();
                    this.scheduleRetry(500);
                });

                conn.on('error', () => {
                    clearTimeout(timeout);
                    this.scheduleRetry(1000);
                });
            },

            handleHostData(data) {
                this.lastSyncTime = Date.now();
                if (data.type === 'sync') {
                    foodPellets = data.pellets;
                    const seen = new Set();
                    for (let pid in data.players) {
                        seen.add(pid);
                        if (pid === myId) continue;
                        const d = data.players[pid];
                        if (!players[pid]) {
                            players[pid] = new Player(pid, d.name, d.path[0].x, d.path[0].y, d.isBot);
                        }
                        Object.assign(players[pid], d);
                    }
                    for (let pid in players) {
                        if (pid !== myId && !seen.has(pid)) delete players[pid];
                    }
                }
            },

            startWatchdog() {
                this.stopWatchdog();
                this.hostWatchdog = setInterval(() => {
                    if (Date.now() - this.lastSyncTime > 6000) {
                        setStatus('Host unresponsive. Taking over...', 'wait');
                        this.stopWatchdog();
                        this.teardown();
                        this.tryBecomeHostOrConnect();
                    }
                }, 2000);
            },

            stopWatchdog() {
                if (this.hostWatchdog) { clearInterval(this.hostWatchdog); this.hostWatchdog = null; }
            },

            becomeHostSetup() {
                setStatus('Hosting game', 'ok');
                players = {};
                foodPellets = [];
                for (let i = 0; i < 200; i++) spawnPellet();
                for (let i = 0; i < BOT_TARGET_COUNT; i++) spawnBot();
                if (myPlayer && isPlaying) {
                    myPlayer.id = myId;
                    players[myId] = myPlayer;
                }

                this.peer.on('connection', (conn) => {
                    this.connections[conn.peer] = conn;
                    conn.on('data', (data) => {
                        if (data.type === 'input' && players[conn.peer]) {
                            players[conn.peer].nextDir = data.dir;
                        }
                        if (data.type === 'join' && !players[conn.peer]) {
                            const pos = findSafeSpawn();
                            players[conn.peer] = new Player(conn.peer, data.name, pos.x, pos.y, false);
                        }
                    });
                    conn.on('close', () => {
                        delete this.connections[conn.peer];
                        delete players[conn.peer];
                    });
                });

                this.startBroadcast();
            },

            startBroadcast() {
                if (this.broadcastInterval) clearInterval(this.broadcastInterval);
                this.broadcastInterval = setInterval(() => {
                    if (!this.isHost) return;
                    const serialized = {};
                    for (let pid in players) {
                        const p = players[pid];
                        serialized[pid] = {
                            id: p.id, name: p.name, isBot: p.isBot,
                            dir: p.dir, speed: p.speed, score: p.score,
                            alive: p.alive, path: p.path, color: p.color
                        };
                    }
                    for (let cid in this.connections) {
                        if (this.connections[cid].open) {
                            this.connections[cid].send({ type: 'sync', players: serialized, pellets: foodPellets });
                        }
                    }
                }, 50);
            },

            scheduleRetry(delay) {
                this.reconnectAttempts++;
                if (this.reconnectAttempts > 4) this.useRelayOnly = true;
                const d = delay || Math.min(500 * Math.pow(1.5, this.reconnectAttempts), 6000) + Math.random() * 300;
                setTimeout(() => this.tryBecomeHostOrConnect(), d);
            },

            sendInput(dir) {
                if (!this.isHost && this.hostConn && this.hostConn.open) {
                    this.hostConn.send({ type: 'input', dir });
                }
            },

            announceJoin(name) {
                if (!this.isHost && this.hostConn && this.hostConn.open) {
                    this.hostConn.send({ type: 'join', name });
                }
            }
        };

        // ============================================================
        // INPUT -- keyboard + touch joystick
        // ============================================================
        function applyDirInput(newDir) {
            if (!myPlayer || !myPlayer.alive) return;
            myPlayer.nextDir = newDir;
            Net.sendInput(newDir);
        }

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            let newDir = null;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') newDir = { x: 0, y: -1 };
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') newDir = { x: 0, y: 1 };
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') newDir = { x: -1, y: 0 };
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') newDir = { x: 1, y: 0 };
            if (newDir) applyDirInput(newDir);
        });

        // Detect touch-capable devices and reveal the on-screen joystick.
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            document.body.classList.add('touch-device');
        }

        (function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let active = false;
            let centerX = 0, centerY = 0;
            const maxRadius = 45;

            function start(clientX, clientY) {
                active = true;
                const rect = zone.getBoundingClientRect();
                centerX = rect.left + rect.width / 2;
                centerY = rect.top + rect.height / 2;
                move(clientX, clientY);
            }

            function move(clientX, clientY) {
                if (!active) return;
                let dx = clientX - centerX;
                let dy = clientY - centerY;
                const dist = Math.hypot(dx, dy);
                const clamped = Math.min(dist, maxRadius);
                const angle = Math.atan2(dy, dx);
                const kx = Math.cos(angle) * clamped;
                const ky = Math.sin(angle) * clamped;
                knob.style.transform = `translate(${kx}px, ${ky}px)`;

                if (dist > 12) {
                    const newDir = Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) };
                    applyDirInput(newDir);
                }
            }

            function end() {
                active = false;
                knob.style.transform = 'translate(0px, 0px)';
            }

            zone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const t = e.changedTouches[0];
                start(t.clientX, t.clientY);
            }, { passive: false });

            zone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const t = e.changedTouches[0];
                move(t.clientX, t.clientY);
            }, { passive: false });

            zone.addEventListener('touchend', (e) => {
                e.preventDefault();
                end();
            }, { passive: false });

            zone.addEventListener('touchcancel', end);

            // mouse fallback so it's testable on desktop too
            zone.addEventListener('mousedown', (e) => start(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => { if (active) move(e.clientX, e.clientY); });
            window.addEventListener('mouseup', end);
        })();

        // ============================================================
        // GAME LOOP / RENDER
        // ============================================================
        function gameLoop() {
            for (let pid in players) {
                players[pid].update();
            }

            if (myPlayer && myPlayer.alive) {
                camera.x += (myPlayer.head.x - camera.x) * 0.1;
                camera.y += (myPlayer.head.y - camera.y) * 0.1;
            }

            render();
            requestAnimationFrame(gameLoop);
        }

        function render() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            ctx.fillStyle = '#060d1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2 - camera.x, canvas.height / 2 - camera.y);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            const startX = Math.floor((camera.x - canvas.width / 2) / GRID_SPACING) * GRID_SPACING;
            const endX = camera.x + canvas.width / 2;
            const startY = Math.floor((camera.y - canvas.height / 2) / GRID_SPACING) * GRID_SPACING;
            const endY = camera.y + canvas.height / 2;

            for (let x = startX; x < endX; x += GRID_SPACING) {
                for (let y = startY; y < endY; y += GRID_SPACING) {
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

            foodPellets.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            let topPlayer = null;
            let maxScore = -1;
            for (let pid in players) {
                if (players[pid].alive && players[pid].score > maxScore) {
                    maxScore = players[pid].score;
                    topPlayer = players[pid];
                }
            }

            for (let pid in players) {
                const p = players[pid];
                if (!p.alive || p.path.length < 2) continue;

                ctx.strokeStyle = p.color;
                ctx.lineWidth = LINE_WIDTH;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 12;

                ctx.beginPath();
                ctx.moveTo(p.path[0].x, p.path[0].y);
                for (let i = 1; i < p.path.length; i++) {
                    ctx.lineTo(p.path[i].x, p.path[i].y);
                }
                ctx.stroke();

                const head = p.head;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(head.x, head.y, LINE_WIDTH * 0.7, 0, Math.PI * 2);
                ctx.fill();

                if (topPlayer && topPlayer.id === p.id) {
                    ctx.font = '16px sans-serif';
                    ctx.fillText('👑', head.x - 8, head.y - 20);
                }

                ctx.shadowBlur = 0;
                ctx.font = 'bold 12px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, head.x, head.y + 25);
            }

            for (let i = sparkParticles.length - 1; i >= 0; i--) {
                const sp = sparkParticles[i];
                ctx.fillStyle = sp.color;
                ctx.fillRect(sp.x, sp.y, 3, 3);
                sp.x += sp.vx;
                sp.y += sp.vy;
                sp.life -= 0.05;
                if (sp.life <= 0) sparkParticles.splice(i, 1);
            }

            ctx.restore();

            renderLeaderboard();
            renderMinimap();
        }

        function renderLeaderboard() {
            const listEl = document.getElementById('lb-list');
            const sorted = Object.values(players)
                .filter(p => p.alive)
                .sort((a, b) => b.score - a.score)
                .slice(0, 6);

            listEl.innerHTML = sorted.map((p, idx) => `
                <div class="lb-entry ${p.id === myId ? 'me' : ''}">
                    <span><span class="lb-dot" style="background:${p.color}"></span>${idx + 1}. ${p.name}</span>
                    <span>${Math.floor(p.score)}</span>
                </div>
            `).join('');
        }

        function renderMinimap() {
            mctx.fillStyle = '#050b14';
            mctx.fillRect(0, 0, 140, 140);

            const scale = 140 / WORLD_SIZE;
            for (let pid in players) {
                const p = players[pid];
                if (!p.alive) continue;
                mctx.fillStyle = p.id === myId ? '#39ff14' : p.color;
                mctx.fillRect(p.head.x * scale, p.head.y * scale, 3, 3);
            }
        }

        document.getElementById('play-btn').addEventListener('click', startGame);
        document.getElementById('respawn-btn').addEventListener('click', respawnGame);

        function startGame() {
            const name = document.getElementById('nickname').value || 'PowerRider';
            const pos = findSafeSpawn();

            myPlayer = new Player(myId || 'local-pending', name, pos.x, pos.y, false);
            if (myId) {
                myPlayer.id = myId;
                players[myId] = myPlayer;
            }

            camera.x = pos.x;
            camera.y = pos.y;

            document.getElementById('menu-screen').style.display = 'none';
            isPlaying = true;

            if (myId) {
                Net.announceJoin(name);
            }
        }

        function respawnGame() {
            document.getElementById('death-screen').style.display = 'none';
            startGame();
        }

        (async function boot() {
            setStatus('Loading networking library...', 'wait');
            const ok = await ensurePeerJsLoaded();
            if (!ok) {
                setStatus('Could not load the networking library — check your connection, ad-blocker, or firewall, then reload.', 'err');
                document.getElementById('play-btn').disabled = true;
                return;
            }
            Net.start();
        })();

        requestAnimationFrame(gameLoop);
    </script>
</body>
